<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Forge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/vendor/diff2html/diff2html.min.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="mobile-toolbar">
        <button id="mobileMenuButton" class="mobile-icon-button" type="button" aria-label="Open navigation" aria-controls="mobileSidebar" aria-expanded="false">
          <i data-lucide="menu"></i>
        </button>
        <div class="mobile-view-switcher" role="tablist" aria-label="Workspace view">
          <button id="mobileDetailsButton" type="button" role="tab" aria-controls="detailsPanel" aria-selected="true">Details</button>
          <button id="mobileChatButton" type="button" role="tab" aria-controls="agentPanel" aria-selected="false">Chat</button>
        </div>
        <button id="mobileImmersiveButton" class="mobile-icon-button mobile-immersive-button" type="button" aria-label="Toggle immersive chat" aria-pressed="false">
          <i data-lucide="maximize-2"></i>
        </button>
      </header>
      <button id="mobileSidebarBackdrop" class="mobile-sidebar-backdrop" type="button" aria-label="Close navigation"></button>
      <aside id="mobileSidebar" class="sidebar">
        <div class="brand-band">
          <div class="brand-mark">F</div>
          <div class="brand-copy">
            <strong>Forge</strong>
            <span>v0.1.0</span>
          </div>
        </div>

        <section class="workspace-switcher">
          <div class="workspace-select-row">
            <button id="workspaceSwitcher" class="workspace-switcher-button" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="workspace-avatar" id="workspaceAvatar">A</span>
              <span class="workspace-switcher-name" id="workspaceSwitcherName">Workspace</span>
              <i data-lucide="chevrons-up-down" class="select-icon"></i>
            </button>
            <div id="workspaceMenu" class="workspace-menu" role="listbox" hidden></div>
          </div>
        </section>

        <section class="tree-section">
          <div class="section-title">
            <span>Projects</span>
            <button id="newProjectButton" title="New project"><i data-lucide="plus"></i></button>
          </div>
          <nav id="projectTree" class="project-tree"></nav>
        </section>

        <div id="sessionResize" class="resize-handle horizontal-resize sidebar-session-resize" role="separator" aria-orientation="horizontal" aria-label="Resize sessions panel"></div>

        <section class="session-section">
          <div class="section-title">
            <span>Sessions</span>
          </div>
          <div id="sessionList" class="session-list"></div>
        </section>

        <div class="sidebar-footer">
          <button id="systemSettingsButton" type="button">
            <i data-lucide="settings"></i>
            <span>Settings</span>
          </button>
        </div>
      </aside>

      <div id="sidebarResize" class="resize-handle sidebar-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

      <main class="workspace-panel">
        <section id="detailsPanel" class="details-panel"></section>
        <div id="detailsResize" class="resize-handle details-resize" role="separator" aria-orientation="vertical" aria-label="Resize chat panel"></div>
        <aside id="agentPanel" class="agent-panel">
          <div id="agentControls" class="agent-actions"></div>
          <div id="agentSessionsWrap" class="agent-sessions"></div>
          <div class="tty-panel">
            <div id="ttyLog" class="tty-log"></div>
            <div id="ttyComposer" class="tty-composer"></div>
          </div>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="uploadDialogRoot"></div>
    <div id="createDialogRoot"></div>
    <div id="autoRunDialogRoot"></div>
    <div id="settingsRoot"></div>
    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/vendor/diff2html/diff2html.min.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script src="/vendor/marked/marked.min.js"></script>
    <script src="/vendor/agenthub-event-timeline/event-timeline.iife.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
