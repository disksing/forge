<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PUA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/pua-app.css" />
    <link rel="stylesheet" href="/vendor/diff2html/diff2html.min.css" />
  </head>
  <body>
    <script>
      // Apply the persisted theme before first paint to avoid flashing the
      // default theme. Must stay in sync with the registry in
      // web/src/controllers/theme-controller.ts; an unknown id simply matches
      // no override rules and falls back to the default appearance.
      try {
        var storedTheme = localStorage.getItem("pua.web.themePreference");
        document.documentElement.dataset.theme = /^[a-z0-9-]+$/.test(storedTheme || "") ? storedTheme : "default";
      } catch (_) {
        document.documentElement.dataset.theme = "default";
      }
    </script>
    <div id="app"></div>
    <!-- Riso theme stencil-cut edge filter. The rules referencing it must
         live inline (not in an external stylesheet) because url(#...) in
         external CSS resolves against the stylesheet URL. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="riso-rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="t" />
        <feDisplacementMap in="SourceGraphic" in2="t" scale="1.2" />
      </filter>
    </svg>
    <style>
      :root[data-theme="riso"] .create-dialog,
      :root[data-theme="riso"] .upload-dialog,
      :root[data-theme="riso"] .file-modal,
      :root[data-theme="riso"] .settings-modal,
      :root[data-theme="riso"] .confirm-dialog,
      :root[data-theme="riso"] .diff-modal {
        filter: url(#riso-rough);
      }
    </style>
    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/vendor/diff2html/diff2html.min.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script src="/vendor/marked/marked.min.js"></script>
    <script type="module" src="/assets/pua-app.js"></script>
  </body>
</html>
